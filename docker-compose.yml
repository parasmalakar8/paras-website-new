services:
  paras-site:
    image: paras-website-new
    container_name: paras-site
    ports:
      - "8082:80"
    restart: always

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: always

  ngrok:
    image: ngrok/ngrok
    container_name: ngrok
    ports:
      - "4040:4040"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: always

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

  my-grafana:
    image: grafana/grafana
    container_name: my-grafana
    ports:
      - "3000:3000"
    restart: always

volumes:
  jenkins_home: